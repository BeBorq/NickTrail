[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nicktrail"
version = "0.20.0rc19"
description = "Local, evidence-based audit of your own public footprint: find forgotten accounts and see how they connect"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["osint", "privacy", "self-audit", "digital-footprint", "username"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Topic :: Security"]
dependencies = []

[project.scripts]
nicktrail = "nicktrail.__main__:main"

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]

[tool.setuptools]
packages = ["nicktrail"]

[tool.setuptools.package-data]
nicktrail = ["*.html", "*.json"]

[tool.black]
line-length = 110
target-version = ["py311"]
skip-string-normalization = true
