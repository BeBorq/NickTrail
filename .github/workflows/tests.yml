name: Offline tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -p web_smoke.py -v
      - run: python -m nicktrail --db demo.sqlite3 demo
      - name: Panel checks (Node)
        if: runner.os == 'Linux'
        shell: bash
        run: for f in tests/test_panel_*.js; do node "$f"; done
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install "black==26.5.1"
      - run: black --check nicktrail tests
